name = "resemble"
main = "worker.js"
compatibility_date = "2026-09-03"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "resemble-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
PAYMENT_MODE = "demo"
PAYMENT_PROVIDER = "Razorpay"
RESEMBLE_ADMIN_EMAIL = "admin@resemble.local"
RESEMBLE_ADMIN_PASSWORD = "CHANGE_THIS_ADMIN_PASSWORD"
